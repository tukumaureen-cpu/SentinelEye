<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentinelEye Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#290c08;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:#350d38;
    width:400px;
    padding:40px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(255,0,191,0.3);
}

/* Logo */
.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:120px;
    height:auto;
}

.login-box h2{
    text-align:center;
    color:#ff000d;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border:none;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#ff0062;
    color:#29080f;
    border:none;
    border-radius:6px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:rgba(255,255,255,0.055);
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SentinelEye Logo">
</div>

<h2>SentinelEye Login</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
